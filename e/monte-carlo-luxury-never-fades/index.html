    (function () {
      var conteudo = document.getElementById('evento-conteudo');

      // Slug vem do caminho (/e/<slug>/) ou de ?e=<slug> (evento.html?e=...).
      function slugDaUrl() {
        var m = location.pathname.match(/\/e\/([^\/?#]+)/);
        if (m) return decodeURIComponent(m[1]);
        return new URLSearchParams(location.search).get('e') || '';
      }
      var slug = slugDaUrl();
      var mostrado = false;

      function naoAchou() {
        document.title = 'Evento não encontrado — Flow Tickets';
        conteudo.innerHTML =
          '<div class="nao-achou">' +
            '<h1>Evento não encontrado</h1>' +
            '<p>Esse link pode ter mudado ou o evento saiu do ar. Veja os eventos disponíveis na Flow.</p>' +
            '<a class="btn btn-primario" href="/#eventos">Ver eventos</a>' +
          '</div>';
      }

      function desenhar(lista, final) {
        var ev = slug ? flowAcharEvento(lista || [], slug) : null;
        // Nuvem confirmou que o evento não existe (ex.: removido no painel).
        if (!ev) { if (final) naoAchou(); return; }
        mostrado = true;
        document.title = ev.nome + ' — Flow Tickets';
        conteudo.innerHTML = '<div class="modal">' + flowHtmlDetalhe(ev) + '</div>';
        flowLigarDetalhe(conteudo, ev);
        document.querySelectorAll('[data-msg]').forEach(function (a) {
          a.href = flowLinkContato(FLOW_MSG_SUPORTE[a.dataset.msg]);
        });
      }

      // 1) dados já embutidos pelo robô (aparece na hora)
      if (window.FLOW_EVENTO_PRE) desenhar([window.FLOW_EVENTO_PRE], false);
      // 2) cache deste navegador (quem já visitou o site)
      try {
        var cache = JSON.parse(localStorage.getItem('flow_eventos'));
        if (Array.isArray(cache)) desenhar(cache, false);
      } catch (e) {}
      // 3) versão oficial da nuvem (sempre a mais atual)
      if (window.FlowCloud && FlowCloud.ativo()) {
        FlowCloud.carregar().then(function (dados) {
          if (dados && dados.eventos) {
            flowSalvarEventos(dados.eventos);
            if (dados.config) flowSalvarConfig(dados.config);
            desenhar(dados.eventos, true);
          } else if (!mostrado) { naoAchou(); }
        }).catch(function () { if (!mostrado) naoAchou(); });
      } else {
        desenhar(flowCarregarEventos(), true);
      }
    })();
